name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java 21 build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package every module
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./mvnw.cmd -B verify
          else
            ./mvnw -B verify
          fi

      - name: Run zero-key Jev example
        shell: bash
        env:
          AGENTJ_JEV_MODE: local
        run: |
          java -jar examples/hybrid-agent/target/agentj-example-hybrid-0.1.0.jar \
            "The payment integration failed for three days and the customer needs help today."
